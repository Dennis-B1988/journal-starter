apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      serviceAccountName: journal-api
      containers:
      - name: journal-api
        image: <YOUR_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/<ECR_REPOSITORY>:<ECR_TAG>
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER 
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: journal-secret
                key: DATABASE_URL
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: journal-secret
                key: OPENAI_API_KEY
          - name: BEDROCK_GUARDRAIL_IDENTIFIER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: BEDROCK_GUARDRAIL_IDENTIFIER

          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: journal-config
                key: POSTGRES_DB
          - name: OPENAI_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: journal-config
                key: OPENAI_BASE_URL
          - name: OPENAI_MODEL
            valueFrom:
              configMapKeyRef:
                name: journal-config
                key: OPENAI_MODEL
          - name: BEDROCK_GUARDRAIL_VERSION
            valueFrom:
              configMapKeyRef:
                name: journal-config
                key: BEDROCK_GUARDRAIL_VERSION
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: journal-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: journal-api
  namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: journal-config
data:
  # The ConfigMap values do not need to be base64-encoded.
  POSTGRES_DB: "career_journal"
  OPENAI_BASE_URL: "https://bedrock-mantle.us-east-1.api.aws/v1"
  OPENAI_MODEL: "openai.gpt-oss-120b"
  BEDROCK_GUARDRAIL_VERSION: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: journal-secret
type: Opaque
data:
  # The Secret values need to be base64-encoded. For example, to encode the string "postgres://user:password@host:port/dbname", you can use the command:
  # echo -n "postgres://user:password@host:port/dbname" | base64
  DATABASE_URL: postgresql://<USER>:<PASSWORD>@<DATABASE-ENDPOINT>/career_journal 
  OPENAI_API_KEY: aWFt # IAM
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
data:
  POSTGRES_USER: <YOUR_POSTGRES_USER>
  POSTGRES_PASSWORD: <YOUR_POSTGRES_PASSWORD>
  BEDROCK_GUARDRAIL_IDENTIFIER: <YOUR_GUARDRAIL_IDENTIFIER>